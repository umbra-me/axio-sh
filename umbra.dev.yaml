schema_version: 1
component: axio/site
hosts:
- macos
- linux
- windows
tools:
- executable: pnpm
  version: 26.8.1
  arguments:
  - --config.verify-deps-before-run=false
  - exec
  - node
  - --version
- executable: pnpm
  version: 11.24.0
actions:
  prepare:
  - executable: pnpm
    arguments:
    - install
    - --frozen-lockfile
    cwd: .
  check:
  - executable: pnpm
    arguments:
    - check
    cwd: .
  build:
  - executable: pnpm
    arguments:
    - build
    cwd: .
  release:
  - executable: pnpm
    arguments:
    - release:check
    cwd: .
fixtures:
  kind: synthetic
  services: []
manual_gates:
- browser visual/accessibility acceptance
- authenticated artifact distribution
- production route acceptance
