schema_version: 1
component: axio/site
hosts:
- macos
- linux
- windows
tools:
- executable: pnpm
  version: 26.8.1
  arguments:
  - --config.verify-deps-before-run=false
  - exec
  - node
  - --version
- executable: pnpm
  version: 11.24.0
actions:
  prepare:
  - executable: node
    arguments:
    - scripts/private-registry.mjs
    - --
    - pnpm
    - install
    - --frozen-lockfile
    cwd: .
  check:
  - executable: node
    arguments:
    - scripts/private-registry.mjs
    - --
    - pnpm
    - check
    cwd: .
  - executable: node
    arguments:
    - scripts/private-registry.mjs
    - --
    - pnpm
    - release:test
    cwd: .
  build:
  - executable: node
    arguments:
    - scripts/private-registry.mjs
    - --
    - pnpm
    - build
    cwd: .
  release:
  - executable: node
    arguments:
    - scripts/private-registry.mjs
    - --
    - pnpm
    - release:check
    cwd: .
fixtures:
  kind: synthetic
  services: []
manual_gates:
- browser visual/accessibility acceptance
- production route acceptance
previews:
- id: web
  executable: node
  arguments:
  - node_modules/next/dist/bin/next
  - dev
  - --hostname
  - '{host}'
  - --port
  - '{port}'
  cwd: .
  port: 3311
  routing:
    hostnames:
    - axio.sh.localhost
    - www.axio.sh.localhost
    readiness_path: /
    timeout_seconds: 120
  dependencies: []
